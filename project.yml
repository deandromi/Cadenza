name: Cadenza
options:
  bundleIdPrefix: dev.cadenza
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Cadenza:
    path: .

targets:
  Cadenza:
    type: application
    platform: macOS
    sources:
      - Sources/CadenzaApp
    dependencies:
      - package: Cadenza
        product: CadenzaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cadenza.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: true

schemes:
  Cadenza:
    build:
      targets:
        Cadenza: all
    run:
      config: Debug
